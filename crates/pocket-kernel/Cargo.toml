[package]
name = "pocket-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Process model, virtual memory and IAT-thunk management for PocketHLE."

[features]
default = ["audio-cpal"]
# Real-time audio output via the host's default device. Disable
# (e.g. on the Android JNI build, or in headless CI runs without a
# sound card) to fall back to a silent in-memory stub.
audio-cpal = ["dep:cpal"]

[dependencies]
flate2.workspace = true
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
byteorder.workspace = true
bytemuck.workspace = true
cpal = { version = "0.15", optional = true }
rmp3 = { version = "0.3.1", features = ["std"] }

pocket-cpu = { path = "../pocket-cpu" }
pocket-pe = { path = "../pocket-pe" }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Devices_Bluetooth", "Win32_Networking_WinSock", "Win32_Networking_WinHttp", "Win32_System_Com", "Win32_System_Power"] }

windows = { version = "0.54", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_WinRT", "Devices_Geolocation", "Foundation"] }
