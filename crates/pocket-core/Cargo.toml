[package]
name = "pocket-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "PocketHLE top-level Emulator: glues loader, CPU, kernel and API stubs."

[features]
default = []
unicorn = ["pocket-cpu/unicorn"]
# Real-time audio output via cpal. Forwards to the same feature on
# the kernel + winceapi crates so that pulling it in here is enough
# to activate the cpal stack across the whole stack. Off by default
# so consumers like the Android JNI build (no host audio device,
# loads cpal/oboe-sys lazily) get the silent in-memory stub.
audio-cpal = ["pocket-kernel/audio-cpal", "pocket-winceapi/audio-cpal"]

[dependencies]
anyhow.workspace = true
log.workspace = true
thiserror.workspace = true

pocket-cab = { path = "../pocket-cab" }
pocket-pe = { path = "../pocket-pe" }
pocket-cpu = { path = "../pocket-cpu" }
pocket-kernel = { path = "../pocket-kernel", default-features = false }
pocket-winceapi = { path = "../pocket-winceapi", default-features = false }
