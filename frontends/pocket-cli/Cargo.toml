[package]
name = "pocket-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Linux command-line frontend for PocketHLE."

[[bin]]
name = "pockethle"
path = "src/main.rs"

[features]
# By default we ship a fully-functional binary: real ARM CPU
# (`unicorn`) plus a host preview window (`display`) and real-time
# audio (`audio-cpal`) so a user can run `pockethle run game.cab`
# and both see and hear something without rebuilding. Use
# `--no-default-features` for a fast cmake-less build (e.g. on CI
# machines without libclang) — that gives a trace-only stub CPU,
# no live window, and silent audio.
default = ["unicorn", "display", "audio-cpal"]
unicorn = ["pocket-core/unicorn"]
display = ["minifb"]
audio-cpal = ["pocket-core/audio-cpal"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
minifb = { version = "0.27", optional = true }
tempfile = "3"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
unshield = "0.2"
flate2 = "1"

pocket-core = { path = "../../crates/pocket-core" }
pocket-library = { path = "../../crates/pocket-library" }
